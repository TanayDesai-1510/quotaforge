server:
  port: 8081

spring:
  application:
    name: quotaforge
  datasource:
    url: jdbc:postgresql://localhost:5433/quotaforge
    username: quotaforge
    password: quotaforge
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  otlp:
    metrics:
      export:
        enabled: false
  metrics:
    tags:
      application: quotaforge